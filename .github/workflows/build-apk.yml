name: Gerar APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rodar os testes
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de depuração
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: enquadra-mg-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar relatórios (quando falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-enquadra-mg
          path: app/build/reports/
          if-no-files-found: ignore

      # Publica o APK num release de tag fixa, para haver sempre um link direto que se abre
      # no navegador do celular e instala. O artefato do Actions exige login do GitHub e vem
      # dentro de um zip — inutil no telefone, em campo.
      - name: Publicar o APK em release de link fixo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk enquadra-mg.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk enquadra-mg.apk \
            --title "APK mais recente" \
            --notes "Compilado do commit ${{ github.sha }} em $(date -u '+%d/%m/%Y %H:%M UTC'). Baixe o .apk abaixo direto no celular."
